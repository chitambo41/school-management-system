<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results | Opportunity School Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <!-- If the current user is logged in, show the app shell -->
  
    <div class="d-md-flex">
      <aside class="sidebar">
  <div class="brand">
    <img src="/images/logo.jpg" alt="Opportunity School" class="brand-logo">
    Opportunity School
    <span class="badge-role">
      Parent / Guardian
    </span>
  </div>

  <nav>
    
      <a href="/parent/dashboard" class=""><span class="ico"><i class="bi bi-speedometer2"></i></span> Dashboard</a>
      <a href="/parent/apply" class=""><span class="ico"><i class="bi bi-clipboard-plus"></i></span> Apply for Admission</a>
      <a href="/parent/applications" class=""><span class="ico"><i class="bi bi-clipboard-check"></i></span> My Applications</a>
      <a href="/parent/children" class=""><span class="ico"><i class="bi bi-people"></i></span> My Children</a>
      <a href="/parent/results" class="active"><span class="ico"><i class="bi bi-graph-up"></i></span> Results</a>
      <a href="/parent/progress" class=""><span class="ico"><i class="bi bi-bar-chart"></i></span> Academic Progress</a>
      <a href="/parent/messages" class=""><span class="ico"><i class="bi bi-envelope"></i></span> Messages</a>
    
  </nav>

  <div class="sidebar-footer">
    <div class="mb-1">Sarah Davis</div>
    <form action="/auth/logout" method="POST" class="d-inline">
      <button class="btn btn-sm btn-outline-light">Log out</button>
    </form>
  </div>
</aside>
      <div class="main-area">
        <header class="topbar">
  <div>
    <img src="/images/logo.jpg" alt="Opportunity School" class="topbar-logo">
  </div>
  <div class="d-flex align-items-center gap-3">
    <span class="badge badge-soft-primary d-none d-md-inline" title="Active academic period">
      <i class="bi bi-calendar3 me-1"></i>2025 · term 1
    </span>
    <span class="text-muted small d-none d-md-inline"><i class="bi bi-person-circle me-1"></i>Sarah Davis</span>
    <form action="/auth/logout" method="POST" class="d-inline">
      <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-box-arrow-right"></i> Log out</button>
    </form>
  </div>
</header>
        <div class="content">
          
  
    <div class="alert alert-success alert-dismissible fade show" role="alert">
      Welcome back, Sarah Davis!
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  
  

          
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <h4 class="fw-bold mb-0"><i class="bi bi-graph-up me-2"></i>Results</h4>
  <div class="d-flex gap-2">
    <select name="child" class="form-select form-select-sm" data-filter-form style="min-width:160px">
      
        <option value="1" selected>Emma Davis</option>
      
    </select>
    <select name="term" class="form-select form-select-sm" data-filter-form style="min-width:160px">
      
        <option value="1" >Term 1 (2024-2025)</option>
      
        <option value="4" >term 1 (2025)</option>
      
    </select>
  </div>
</div>


  <div class="card"><div class="card-body text-center text-muted py-5">Please select a term.</div></div>

        </div>
      </div>
    </div>
  

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
