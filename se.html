        <div class="content">
          
  
  

          <div class="mb-3">
  <a href="/admin/students" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back</a>
</div>

<div class="card">
  <div class="card-header">Edit Student</div>
  <div class="card-body">
    <form action="/admin/students/10" method="POST">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Full name *</label>
          <input type="text" name="name" value="Test Guardian" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Parent / Guardian name</label>
          <input type="text" name="guardian_name" value="Mama Nibling" class="form-control" placeholder="e.g. John Davis">
        </div>
        <div class="col-md-6">
          <label class="form-label">Parent account (optional — for portal access)</label>
          <select name="parent_user_id" class="form-select">
            <option value="">— None —</option>
            
              <option value="10" >abdon kanuth (abdonkanuth@gmail.com)</option>
            
              <option value="8" >anthony (anthony@gmail.com)</option>
            
              <option value="6" >David Brown (parent2@school.com)</option>
            
              <option value="15" >samwel kibona (samweli@gmail.com)</option>
            
              <option value="5" >Sarah Davis (parent1@school.com)</option>
            
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Class (enroll)</label>
          <select name="class_id" class="form-select">
            <option value="">— None —</option>
            
              <option value="8" >KG 1 main</option>
            
              <option value="10" >standard 3 A</option>
            
              <option value="11" >standard 4 A</option>
            
              <option value="12" >standard 5 A</option>
            
          </select>
          
        </div>
        <div class="col-md-4">
          <label class="form-label">Date of birth *</label>
          <input type="date" name="date_of_birth" value="2012-06-10" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Gender *</label>
          <select name="gender" class="form-select" required>
            <option value="female" selected>Female</option>
            <option value="male" >Male</option>
            <option value="other" >Other</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Address</label>
          <input type="text" name="address" value="" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label">Previous school</label>
          <input type="text" name="previous_school" value="" class="form-control">
        </div>
        
          <div class="col-md-4">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
              
                <option value="active" selected>active</option>
              
                <option value="graduated" >graduated</option>
              
                <option value="transferred" >transferred</option>
              
                <option value="dropped" >dropped</option>
              
            </select>
          </div>
        
        <div class="col-12 mt-3">
          <button class="btn btn-primary">Save changes</button>
        </div>
      </div>
    </form>
  </div>
</div>
        </div>
      </div>
    </div>
  

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
