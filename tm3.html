<!DOCTYPE html>

  </div>

  <nav>

      <a href="/teacher/results" class=""><span class="ico"><i class="bi bi-graph-up"></i></span> Results &amp; Progress</a>

      <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-box-arrow-right"></i> Log out</button>
